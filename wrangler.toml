name = "cfgem"
main = "worker.js"
compatibility_date = "2026-10-31"

preview_urls = true
workers_dev = true

routes = [
  { pattern = "umei.uk", custom_domain = true }
]

[observability.logs]
enabled = true
invocation_logs = true

# Enables importing raw HTML text files via ES Modules inside worker.js
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

